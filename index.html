label{display:block;font:600 12px inherit;color:var(--mut);margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}textarea{height:90px}

button.stat{width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}button.stat:hover{transform:translateY(-2px)}button.stat.on{outline:2px solid var(--ac);background:var(--soft)}
