<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Keluar - Smart Tempah IBS</title><style>body{font-family:system-ui,Segoe UI,sans-serif;background:#fbf7f3;color:#2b1215;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}.c{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:28px;max-width:420px;box-shadow:0 6px 18px rgba(0,0,0,.07)}h1{color:#7d0b13;margin:0 0 8px}.btn{display:inline-block;margin-top:16px;background:#a50f19;color:#fff;text-decoration:none;padding:11px 20px;border-radius:99px;font-weight:700}</style></head><body><div class="c"><h1>Anda telah log keluar</h1><p>Sesi PIC / Admin telah ditamatkan. Tema warna anda dikekalkan. Tempahan dalam Google Sheet tidak terjejas.</p><a class="btn" href="./?logout=1">Kembali ke Utama</a></div><script>
try{['pic_ibs','idt_ibs','ap_ibs'].forEach(function(k){sessionStorage.removeItem(k);localStorage.removeItem(k);});}catch(e){}
try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();}catch(e){}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
setTimeout(function(){location.replace('./?logout='+Date.now())},900);
</script></body></html>
